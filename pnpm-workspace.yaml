packages:
  - .

overrides:
  brace-expansion: 5.0.9
  deepmerge-ts: 8.0.0
  fast-uri: 3.1.5
  'find-my-way@<=9.6.0': 9.7.0
  'js-yaml@>=3.0.0 <3.15.1': 3.15.1
  'js-yaml@>=4.0.0 <4.3.1': 4.3.1
  'js-yaml@>=5.0.0 <=5.2.1': 5.2.2
  multer: 2.2.0
  picomatch@4.0.5: 4.0.4
  type-fest@5.8.0: 5.7.0
  'valibot@<=1.4.1': 1.4.2

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
blockExoticSubdeps: true
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
verifyDepsBeforeRun: install
peerDependencyRules:
  allowedVersions:
    '@nestjs/platform-fastify@11.1.28>@fastify/static': 10.1.2
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  prisma: true
  unrs-resolver: true
